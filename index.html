<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter city name">
    <br>
    <button onclick="getWeather()">Search</button>

    <div id="weatherData"></div>

    <h2>5-Day Forecast</h2>
    <div id="forecast" class="forecast-container"></div>

    <script>
        const apiKey = "df8cbef4e773db5448ff8a040e042293";

        function formatTime(timestamp) {
            return new Date(timestamp * 1000).toLocaleTimeString();   // Convert UNIX timestamp to human-readable time
        }

        function getWeather() {
            const city = document.getElementById("city").value;

            if (!city) {
                alert("Please enter a city name");
                return;
            }

            const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
            const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`;

            // Current Weather
            fetch(weatherUrl)
                .then(res => res.json())
                .then(data => {
                    let icon = data.weather[0].icon;
                    let iconURL = `https://openweathermap.org/img/wn/${icon}@2x.png`;


                    document.getElementById("weatherData").innerHTML = `
                        <div class="card">
                            <img src="${iconURL}">
                            <h2>${data.name}</h2>
                            <h3>${data.weather[0].description.toUpperCase()}</h3>
                            <p>${data.main.temp} °C</p>
                        </div>
            
                        <div class="card">
                            <h3>Max Temp</h3>
                            <p>${data.main.temp_max} °C</p>
                        </div>
                        <div class="card">
                            <h3>Min Temp</h3>
                            <p>${data.main.temp_min} °C</p>
                        </div>
                        <div class="card">
                            <h3>Humidity</h3>
                            <p>${data.main.humidity} %</p>
                        </div>
                        <div class="card">
                            <h3>Sunrise</h3>
                            <p>${formatTime(data.sys.sunrise)}</p>
                            </div>
                        <div class="card">
                        <h3>Sunset</h3>
                            <p>${formatTime(data.sys.sunset)}</p>
                        </div>
                        <div class="card">
                            <h3>Country</h3>
                            <p>${data.sys.country}</p>
                        </div>
                        <div class="card">
                            <h3>Pressure</h3>
                            <p>${data.main.pressure} hPa</p>
                        </div>
                    `;
                })
                .catch(err => {
                    console.error(err);
                    alert("City not found!");
                });

            // Forecast
            fetch(forecastUrl)
                .then(res => res.json())
                .then(data => {
                    const forecastDiv = document.getElementById("forecast");
                    forecastDiv.innerHTML = "";

                    const uniqueDays = [];

                    data.list.forEach(item => {
                        const date = new Date(item.dt * 1000).getDate();         // Get the day of the month from the timestamp

                        if (!uniqueDays.includes(date) && uniqueDays.length < 5) {
                            uniqueDays.push(date);

                            const div = document.createElement("div");
                            div.className = "card";

                            const forecastIcon = item.weather[0].icon;
                            const forecastIconURL =
                                `https://openweathermap.org/img/wn/${forecastIcon}@2x.png`;

                            div.innerHTML = `
                                <h4>${new Date(item.dt * 1000).toLocaleDateString()}</h4>
                                <img src="${forecastIconURL}" class="forecast-icon">        
                                <p>${item.weather[0].description.toUpperCase()}</p>
                                <p>${item.main.temp} °C</p>
                            `;

                            forecastDiv.appendChild(div);                    // Add the forecast card to the container
                        }
                    });
                })
                .catch(err => console.error(err));
        }
    </script>

</body>

</html>
